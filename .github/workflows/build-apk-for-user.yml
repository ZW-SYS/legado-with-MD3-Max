name: Build APK for User

on:
  workflow_dispatch:
    inputs:
      branch:
        description: '要构建的分支'
        required: true
        default: 'main'
      product:
        description: '产品变体：appCore 基础版无本地引擎，appComic 漫画增强版内置本地 OCR/擦除/气泡检测'
        required: true
        type: choice
        options:
          - appCore
          - appComic
        default: appCore

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PRODUCT: ${{ github.event.inputs.product }}
      PRODUCT_TAG: "${{ github.event.inputs.product == 'appComic' && 'comic' || 'core' }}"
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.branch }}
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Clear 18PlusList.txt
        run: |
          echo "清空18PlusList.txt"
          echo "" > $GITHUB_WORKSPACE/app/src/main/assets/18PlusList.txt

      - name: Remove Aliyun mirrors (unreliable in CI)
        run: |
          sed -i '/maven.aliyun.com/d' settings.gradle

      - name: Write signing config
        shell: bash
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | base64 -d > "$GITHUB_WORKSPACE/app/my-release-key.jks"
          {
            echo ""
            echo "RELEASE_STORE_FILE=my-release-key.jks"
            echo "RELEASE_STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}"
            echo "RELEASE_KEY_ALIAS=${{ secrets.KEY_ALIAS }}"
            echo "RELEASE_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}"
          } >> "$GITHUB_WORKSPACE/gradle.properties"

      - name: Build Signed Release APK
        run: |
          chmod +x gradlew
          # appCore -> AppCore：Gradle 变体任务名是驼峰形式
          PRODUCT_CAP=$(echo "$PRODUCT" | awk '{print toupper(substr($0,1,1)) substr($0,2)}')
          ./gradlew assemble${PRODUCT_CAP}Release -PenableAbiSplits=false --no-daemon --no-configuration-cache
        env:
          COMMIT_NUMBER: ${{ github.run_number }}
          APP_VERSION_NAME: signed-${{ github.run_number }}

      - name: Check Build Output
        run: |
          APK_PATH="$GITHUB_WORKSPACE/app/build/outputs/apk/${{ env.PRODUCT }}/release"
          echo "检查 APK 输出目录: $APK_PATH"
          ls -la "$APK_PATH" || true
          APK_COUNT=$(find "$APK_PATH" -maxdepth 1 -name "*.apk" | wc -l | tr -d ' ')
          if [ "$APK_COUNT" -lt 1 ]; then
            echo "没有生成 APK！"
            exit 1
          fi

      - name: Rename APK Files
        run: |
          APK_PATH="$GITHUB_WORKSPACE/app/build/outputs/apk/${{ env.PRODUCT }}/release"
          cd "$APK_PATH"
          mv -- *.apk "legado-signed-${GITHUB_RUN_NUMBER}-${PRODUCT_TAG}-universal.apk"
          ls -la

      - name: Create ZIP Archive
        run: |
          APK_PATH="$GITHUB_WORKSPACE/app/build/outputs/apk/${{ env.PRODUCT }}/release"
          ZIP_NAME="legado-signed-apks-${GITHUB_RUN_NUMBER}-${PRODUCT_TAG}.zip"
          cd "$APK_PATH"
          zip "$GITHUB_WORKSPACE/$ZIP_NAME" *.apk
          echo "ZIP 文件已创建: $ZIP_NAME"
          ls -la "$GITHUB_WORKSPACE/$ZIP_NAME"

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: legado-apks-${{ env.PRODUCT_TAG }}-${{ github.run_number }}
          path: app/build/outputs/apk/${{ env.PRODUCT }}/release/*.apk

      - name: Upload ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: legado-apks-zip-${{ env.PRODUCT_TAG }}-${{ github.run_number }}
          path: legado-signed-apks-*.zip
